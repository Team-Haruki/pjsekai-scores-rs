sonar.projectKey=Team-Haruki_pjsekai-scores-rs
sonar.organization=team-haruki
sonar.sourceEncoding=UTF-8

# CI helper scripts (wheel smoke test, shim build) run in CI, not under the Rust coverage.
sonar.coverage.exclusions=.github/scripts/**
# The skia-image shim is a metadata-only package whose whole content is its dependency on
# pjsekai-scores-rs; a lock file would be ignored by everyone who installs it (text:S8565).
sonar.issue.ignore.multicriteria=shimNoLock
sonar.issue.ignore.multicriteria.shimNoLock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.shimNoLock.resourceKey=python/skia-image-shim/pyproject.toml
