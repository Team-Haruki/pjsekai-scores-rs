name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      coverage: true
      # musl-tools is for the static CLI check in extra-lint-command; DejaVu Sans is the
      # font of the golden crops and of that check.
      apt-packages: musl-tools fonts-dejavu-core
      # `image` is on by default; python was first compiled at release time before.
      feature-sets: |
        default
        --no-default-features
        --features python
        --features python,system-fonts
      # default runs the golden crops and the no-font error path, --no-default-features
      # the parser/SVG-only build, system-fonts the fontdb fallback.
      test-feature-sets: |
        default
        --no-default-features
        --features system-fonts
      targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      # The image renderer must keep building as a fully static musl CLI (no C or C++,
      # no system libraries); the template has no musl job, so build and run it here.
      extra-lint-command: |
        set -euo pipefail
        cargo check --locked --target wasm32-unknown-unknown --no-default-features --features wasm
        cargo build --locked --target x86_64-unknown-linux-musl --features system-fonts
        bin=target/x86_64-unknown-linux-musl/debug/pjsekai-scores-rs
        file "$bin" | grep -E 'static(-pie)? linked'
        printf '#BPM01: 120\n#00008: 01\n#00012: 14\n#00013: 13\n' > "$RUNNER_TEMP/smoke.sus"
        "$bin" "$RUNNER_TEMP/smoke.sus" --font-path /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf -o "$RUNNER_TEMP/smoke.png"
        "$bin" "$RUNNER_TEMP/smoke.sus" -o "$RUNNER_TEMP/smoke.jpg"
        test -s "$RUNNER_TEMP/smoke.png" && test -s "$RUNNER_TEMP/smoke.jpg"

  wheel-smoke:
    name: Wheel smoke
    uses: seiunx-dev/ci-templates/.github/workflows/maturin-wheels.yml@v1
    with:
      # "test": true is explicit because maturin-wheels@v1 skips the smoke and wheel tests
      # when it is unset (its `matrix.t.test != false` is false for a missing key).
      targets: '[{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64","test":true}]'
      interpreters: "3.13" # one wheel for the smoke-test interpreter is enough on PRs
      sdist: false
      smoke-import: pjsekai_scores_rs
      # Renders SVG, PNG, JPEG and a raster through the installed wheel.
      test-command: python -I .github/scripts/wheel_smoke.py

  # Custom job: the deprecated pjsekai-scores-rs-skia-image shim is a pure-Python
  # package, which no template builds. Same script as release.yml.
  shim:
    name: Skia-image shim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: bash .github/scripts/build-shim.sh "$RUNNER_TEMP/shim-dist"

  sonar:
    name: Sonar
    needs: [rust]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    with:
      project-version: auto
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [rust, wheel-smoke, shim, sonar, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
