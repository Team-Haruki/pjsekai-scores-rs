name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      coverage: true
      apt-packages: libfontconfig1-dev libfreetype-dev
      # python + skia-image were first compiled at release time before; lint them on every PR
      feature-sets: |
        default
        --features python,skia-image
        --features python,tiny-skia-image
      # Both raster backends together run the tiny-skia vs Skia similarity tests.
      test-feature-sets: |
        default
        --features skia-image,tiny-skia-image
      targets: wasm32-unknown-unknown
      extra-lint-command: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features wasm

  wheel-smoke:
    name: Wheel smoke
    uses: seiunx-dev/ci-templates/.github/workflows/maturin-wheels.yml@v1
    with:
      targets: '[{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64"}]'
      # tiny-skia-image is smoke-built only (experimental; not published by release.yml).
      variants: '["default", "skia-image", "tiny-skia-image"]'
      configure-command: |
        case "$WHEEL_VARIANT" in
          skia-image) export PYTHON_PACKAGE_NAME=pjsekai-scores-rs-skia-image MATURIN_FEATURES_TOML='["python", "skia-image"]' ;;
          tiny-skia-image) export PYTHON_PACKAGE_NAME=pjsekai-scores-rs-tiny-skia-image MATURIN_FEATURES_TOML='["python", "tiny-skia-image"]' ;;
          *)          export PYTHON_PACKAGE_NAME=pjsekai-scores-rs MATURIN_FEATURES_TOML='["python"]' ;;
        esac
        bash .github/scripts/configure-python-package.sh
      before-script-linux: 'if [ "{variant}" = skia-image ]; then bash .github/scripts/install-skia-linux-deps.sh {target}; fi'
      interpreters: "3.13" # one wheel for the smoke-test interpreter is enough on PRs
      sdist: false
      smoke-import: pjsekai_scores_rs

  sonar:
    name: Sonar
    needs: [rust]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    with:
      project-version: auto
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [rust, wheel-smoke, sonar, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
