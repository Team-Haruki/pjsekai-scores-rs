name: Release
# Replaces release.yml + release-crate.yml + release-python.yml: one tag, one run.
# PyPI trusted publishing is bound to the workflow FILE: both PyPI projects this run uploads,
# pjsekai-scores-rs and the deprecated pjsekai-scores-rs-skia-image shim, need a trusted
# publisher for this repository, workflow release.yml and environment pypi, or the upload
# fails with invalid-publisher.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1
    with:
      version-source: cargo
      # Library, CLI crate and Python package are versioned in lockstep.
      version-extra-paths: |
        pyproject.toml
        cli/Cargo.toml

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/rust-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      asset-name: "{name}-{label}"
      layout: flat
      # The binary comes from the CLI crate, whose default features include `image`.
      cargo-args: -p pjsekai-scores-rs-cli
      bins: pjsekai-scores-rs

  wheels:
    name: Wheels
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/maturin-wheels.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      # One package; pyproject.toml builds it with features python + image.
      # Same wheel set as release-python.yml: --find-interpreter everywhere (cp39-cp314 + 3.14t
      # where the runner/container has it), plus a manylinux_2_28 leg for x86_64 3.14t.
      interpreters: find
      setup-python-versions: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
      # "test": true is explicit on the tested targets because maturin-wheels@v1 skips the
      # smoke and wheel tests when it is unset (`matrix.t.test != false` is false for null).
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64","test":true},
         {"label":"linux-x64-ft","os":"ubuntu-latest","target":"x86_64","manylinux":"2_28","interpreters":"3.14t","test":false},
         {"label":"linux-arm64","os":"ubuntu-latest","target":"aarch64","test":false},
         {"label":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin","test":true},
         {"label":"macos-x64","os":"macos-15","target":"x86_64-apple-darwin","test":false},
         {"label":"windows-x64","os":"windows-latest","target":"x64","test":true}]
      smoke-import: pjsekai_scores_rs
      # Renders SVG, PNG, JPEG and a raster on every tested target.
      test-command: python -I .github/scripts/wheel_smoke.py

  # Custom job: the deprecated pjsekai-scores-rs-skia-image shim (pure Python, metadata
  # only, see python/skia-image-shim) has no template. It stays at 0.6.0, so later tags
  # rebuild the same files and the PyPI job skips them as existing.
  shim:
    name: Skia-image shim
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: bash .github/scripts/build-shim.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-shim
          path: dist/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [gate, binaries, wheels]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}

  pypi:
    name: PyPI
    needs: [gate, wheels, shim, publish]
    if: needs.gate.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing must run in this (caller) workflow, not in a reusable one.
    environment:
      name: pypi
      url: https://pypi.org/p/pjsekai-scores-rs
    permissions:
      id-token: write
    steps:
      # wheels-* holds both projects: pjsekai-scores-rs and the skia-image shim.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  crates:
    name: crates.io
    needs: [gate, publish]
    if: needs.gate.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache: "false"
      - uses: seiunx-dev/ci-templates/actions/cargo-publish@v1
        with:
          # Library first: the CLI crate depends on it (`=` the same version). The token (the
          # repository secret CARGO_REGISTRY_TOKEN) must cover both crates; publishing a crate
          # name for the first time (pjsekai-scores-rs-cli in 0.6.0) needs its publish-new scope.
          packages: |
            pjsekai-scores-rs
            pjsekai-scores-rs-cli
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
