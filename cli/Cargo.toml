[package]
name = "pjsekai-scores-rs-cli"
# Lockstep with the library: same version as ../Cargo.toml and the requirement below.
version = "0.6.0"
edition = "2024"
description = "Command-line Project SEKAI score (.sus / custom chart JSON) renderer to SVG, PNG and JPEG"
license = "MIT"
repository = "https://github.com/Team-Haruki/pjsekai-scores-rs"
readme = "README.md"

[features]
# PNG/JPEG output. Without it the CLI only writes SVG and says to rebuild with it.
default = ["image"]
image = ["pjsekai-scores-rs/image"]
# Resolve CSS font families that are not passed with --font-path/--font-dir from the
# system fonts (fontdb).
system-fonts = ["image", "pjsekai-scores-rs/system-fonts"]

[dependencies]
pjsekai-scores-rs = { path = "..", version = "=0.6.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pjsekai-scores-rs"
path = "src/main.rs"
