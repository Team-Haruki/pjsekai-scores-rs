[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pjsekai-scores-rs"
version = "0.6.0"
description = "Project SEKAI score (.sus) parser, SVG chart renderer, and PNG/JPEG renderer (Rust implementation)"
requires-python = ">=3.9"

[tool.maturin]
features = ["python", "image"]
module-name = "pjsekai_scores_rs"
