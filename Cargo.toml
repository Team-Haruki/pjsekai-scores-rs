[package]
name = "pjsekai-scores-rs"
version = "0.5.0"
edition = "2024"
description = "Project SEKAI score (.sus) parser, SVG chart renderer, and Skia image renderer"
license = "MIT"

[features]
default = []
python = ["dep:pyo3"]
skia-image = ["dep:mtpng", "dep:skia-safe"]
# Pure-Rust raster backend (tiny-skia + skrifa). Experimental; `skia-image` wins when both are on.
tiny-skia-image = [
    "dep:mtpng",
    "dep:tiny-skia",
    "dep:skrifa",
    "dep:png",
    "dep:zune-jpeg",
    "dep:jpeg-encoder",
    "dep:libz-sys",
]
wasm = ["dep:wasm-bindgen"]

[dependencies]
num = "0.4"
regex = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"], optional = true }
mtpng = { version = "0.4.1", optional = true }
skia-safe = { version = "0.99.0", optional = true }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.48", optional = true, default-features = false, features = ["std"] }
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", optional = true }
jpeg-encoder = { version = "0.7", optional = true, features = ["simd"] }
# mtpng's zlib, built in statically so tiny-skia builds need no shared libraries.
libz-sys = { version = "1.1", optional = true, features = ["static"] }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
# Free-threaded Python requires all #[pyclass] types to be Send + Sync.
# Our types satisfy this since they contain only owned Rust data with no Rc/RefCell.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }

[lib]
name = "pjsekai_scores_rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pjsekai-scores-rs"
path = "src/main.rs"
