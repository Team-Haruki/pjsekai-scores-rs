[package]
name = "pjsekai-scores-rs"
version = "0.6.0"
edition = "2024"
description = "Project SEKAI score (.sus) parser, SVG chart renderer, and pure-Rust PNG/JPEG renderer"
license = "MIT"

[features]
default = ["image"]
python = ["dep:pyo3"]
# PNG/JPEG/raster rendering, pure Rust: tiny-skia + skrifa, png (zlib-rs), zune-jpeg
# and mozjpeg-rs. `--no-default-features` leaves the parser and the SVG renderer.
image = ["dep:tiny-skia", "dep:skrifa", "dep:png", "dep:zune-jpeg", "dep:mozjpeg-rs"]
# With `image`: resolve font families that are not in font_paths/font_dirs
# (and generic ones such as sans-serif) from the system fonts via fontdb.
system-fonts = ["image", "dep:fontdb"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
num = "0.4"
regex = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"], optional = true }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.48", optional = true, default-features = false, features = ["std"] }
# zlib-rs: pure-Rust zlib for the deflate levels (faster than miniz_oxide).
png = { version = "0.18", optional = true, features = ["zlib-rs"] }
zune-jpeg = { version = "0.5", optional = true }
# libjpeg-turbo-compatible output (same scan data), NEON and AVX2, no unsafe code.
mozjpeg-rs = { version = "0.9", optional = true, default-features = false, features = ["fast-yuv"] }
fontdb = { version = "0.24", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
# Free-threaded Python requires all #[pyclass] types to be Send + Sync.
# Our types satisfy this since they contain only owned Rust data with no Rc/RefCell.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }

[lib]
name = "pjsekai_scores_rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pjsekai-scores-rs"
path = "src/main.rs"
